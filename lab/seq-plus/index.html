<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>やりとり図・MyComputer 文書マップ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">
      <h1>やりとり図</h1>
      <span class="from">MyComputer 文書マップの流れを、時間の順に</span>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="流れ"></nav>
    <div class="actions">
      <button class="btn" id="playBtn" type="button" aria-pressed="false" title="1 手ずつ自動で進む（p）"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 2.2v9.6L11.5 7z" fill="currentColor"/></svg><span class="t">順に見る</span></button>
      <button class="btn" id="recBtn" type="button" aria-pressed="false" title="記録の時刻の順に流す。間が長いほど長く待つ（r）"><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.6 4.4v5.2L9.6 7z" fill="currentColor"/></svg><span class="t">記録で流す</span></button>
      <button class="btn" id="openAll" type="button" title="中の紙をこの場に開く（o）"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5h5.5l2.5 2.5v8.5H3z M8.5 1.5V4H11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><span class="t">中の紙をすべて開く</span></button>
      <button class="btn" id="timeBtn" type="button" aria-pressed="true" title="右の列に、記録した時刻を出す（t）"><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 3.8V7l2.2 1.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span class="lbl-long">記録の時間</span></button>
      <button class="btn" id="inspBtn" type="button" aria-pressed="false" title="選んだ手順のデータとコード（i）"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="1.8" y="1.8" width="10.4" height="10.4" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.8 8.5h10.4" stroke="currentColor" stroke-width="1.3"/></svg><span class="lbl-long">詳しく</span><kbd>i</kbd></button>
      <button class="btn more" id="moreBtn" type="button" aria-haspopup="menu" aria-expanded="false" title="ほかの操作"><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="2.8" cy="7" r="1.3" fill="currentColor"/><circle cx="7" cy="7" r="1.3" fill="currentColor"/><circle cx="11.2" cy="7" r="1.3" fill="currentColor"/></svg></button>
      <div class="menu" id="moreMenu" role="menu" hidden>
        <button type="button" role="menuitem" data-act="play">順に見る<kbd>p</kbd></button>
        <button type="button" role="menuitem" data-act="rec">記録で流す<kbd>r</kbd></button>
        <button type="button" role="menuitem" data-act="all">中の紙をすべて開く<kbd>o</kbd></button>
        <button type="button" role="menuitem" data-act="time">記録の時間を出す<kbd>t</kbd></button>
        <button type="button" role="menuitem" data-act="legend">凡例</button>
      </div>
    </div>
  </div>
  <div class="flow-row">
    <h2 id="flowTitle"></h2>
    <span class="sub keys-hint">↑↓ で 1 手ずつ・Enter で中の紙を開く・Esc で閉じる・i で詳しく</span>
    <ul class="layers-key" id="layersKey"></ul>
    <button class="btn legend-btn" id="legendBtn" type="button" title="矢印の種類と層の色">凡例</button>
  </div>
</header>

<main class="stage" id="stage">
  <div class="sheet" id="sheet">
    <div class="corner-l" id="cornerL"></div>
    <div class="hdr-mid"><div class="heads" id="heads"></div></div>
    <div class="corner-r" id="cornerR"></div>
    <div class="narr" id="narr"></div>
    <div class="diag"><svg id="svg" role="img" aria-label="やりとり図。上から下へ手順が進む"></svg><div class="recbadge" id="recBadge" hidden aria-hidden="true"></div></div>
    <div class="time" id="time"></div>
  </div>
</main>

<div class="mini" id="mini" hidden><div class="mini-h"><span>全体<small>押すとそこへ</small></span><button type="button" id="miniClose" title="隠す（m）" aria-label="全体の地図を隠す">×</button></div><svg id="miniSvg" aria-label="図の全体。枠が見えている所"></svg></div>
<aside class="lsheet" id="legendSheet" hidden aria-label="凡例"><div class="insp-h"><h3>凡例</h3><button class="btn x" id="legendClose" type="button">閉じる</button></div><div class="lsheet-b" id="legendBody"></div></aside>
<aside class="insp" id="insp" hidden aria-label="詳しく">
  <div class="insp-h"><h3 id="inspTitle"></h3><button class="btn x" id="inspClose" type="button" title="閉じる（Esc）">閉じる</button></div>
  <div class="insp-b" id="inspBody"></div>
</aside>
<div class="tip" id="tip" role="tooltip"></div>
<div class="sr-only" id="live" aria-live="polite"></div>

<script src="../data/atlas.js"></script>
<script src="../data/code.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
