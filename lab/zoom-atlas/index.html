<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ズームする地図 — MyComputer 文書マップ</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>MyComputer 文書マップ</h1>
    <span class="brand-sub">ズームする地図</span>
  </div>
  <div class="search" role="search">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="探す：関数・置き場・ファイル" autocomplete="off" spellcheck="false" aria-label="地図の中を探す" aria-controls="results" aria-expanded="false" role="combobox">
    <kbd>/</kbd>
    <ul id="results" role="listbox" hidden></ul>
  </div>
  <nav class="flows" aria-label="流れを選ぶ">
    <span class="flows-label">流れ</span>
    <div class="seg" id="flowSeg"></div>
  </nav>
  <div class="layers">
    <button id="layersBtn" type="button" aria-expanded="false" aria-controls="layersMenu">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
      <span>重ねる</span>
    </button>
    <div id="layersMenu" class="menu" hidden></div>
  </div>
</header>

<main id="stage">
  <canvas id="world" aria-label="地図。ホイールで拡大、ドラッグで移動" tabindex="0"></canvas>
  <div id="strip" aria-hidden="true"></div>
  <div id="crumb" aria-live="polite"></div>
  <div id="ladder" aria-label="拡大の段">
    <button type="button" class="zbtn" data-z="in" aria-label="拡大">+</button>
    <ol id="ladderSteps"></ol>
    <button type="button" class="zbtn" data-z="out" aria-label="縮小">−</button>
  </div>
  <div id="miniWrap"><canvas id="mini" aria-label="全体図。押すとそこへ移る"></canvas></div>
  <section id="tour" aria-live="polite"></section>
  <div id="toast" role="status" hidden></div>
</main>

<script src="../data/atlas.js"></script>
<script src="../data/code.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
