<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MyComputer 文書マップ — 積み木の 3D</title>
<link rel="stylesheet" href="style.css">
<script src="../data/atlas.js"></script>
<script src="../data/code.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 id="title">MyComputer 文書マップ</h1>
    <span class="tag">積み木の 3D</span>
  </div>
  <nav class="tabs" id="tabs" aria-label="流れ"></nav>
  <div class="top-right">
    <button class="ghost" id="help-btn" aria-expanded="false">使い方</button>
  </div>
</header>
<main class="app">
  <section class="stage" id="stage" aria-label="立体の地図">
    <div class="gl-host" id="gl"></div>
    <div class="labels" id="labels" aria-hidden="true"></div>
    <div class="crumbs" id="crumbs"></div>
    <div class="viewbtns" id="viewbtns"></div>
    <div class="player" id="player"></div>
    <div class="help" id="help" hidden></div>
    <div class="nogl" id="nogl" hidden></div>
  </section>
  <aside class="panel" id="panel" aria-label="詳しく"></aside>
</main>
<div class="modal" id="code" hidden></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
